version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      commitlint:
        patterns: ["@commitlint/*"]
      eslint:
        patterns: ["eslint", "@eslint/*"]
      eslint-dev:
        patterns: ["typescript-eslint", "eslint-*"]
      typescript:
        patterns: ["@tsconfig/*", "@types/*", "typescript"]
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    groups:
      ybiquitous-actions:
        patterns: ["ybiquitous/.github/*"]
    cooldown:
      default-days: 7
      exclude: ["ybiquitous/.github/*"]
